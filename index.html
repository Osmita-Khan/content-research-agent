<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Content Research & Brief Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; color: #1a1a2e; min-height: 100vh; }
  header { background: #1a1a2e; color: white; padding: 24px 40px; }
  header h1 { font-size: 22px; font-weight: 600; }
  header p { font-size: 13px; color: #9ca3af; margin-top: 4px; }
  .container { max-width: 780px; margin: 40px auto; padding: 0 24px; }
  .card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 24px; }
  label { font-size: 13px; font-weight: 600; color: #374151; display: block; margin-bottom: 8px; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb;
    border-radius: 8px; font-size: 15px; outline: none; transition: border 0.2s;
  }
  input:focus { border-color: #1a1a2e; }
  button {
    background: #1a1a2e; color: white; border: none; padding: 13px 28px;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity 0.2s; width: 100%; margin-top: 8px;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 13px; color: #6b7280; margin-top: 12px; min-height: 20px; }
  .status.loading { color: #2563eb; }
  .status.error { color: #dc2626; }
  .output { display: none; }
  .output.visible { display: block; }
  .brief-section { margin-bottom: 20px; }
  .brief-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #6b7280; text-transform: uppercase; margin-bottom: 6px; }
  .brief-content { font-size: 15px; line-height: 1.7; color: #1a1a2e; white-space: pre-wrap; }
  .divider { border: none; border-top: 1px solid #f3f4f6; margin: 20px 0; }
  .tag { display: inline-block; background: #f0fdf4; color: #15803d; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin-bottom: 16px; }
  .setup-note { font-size: 12px; color: #9ca3af; margin-top: 6px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bullet { margin-left: 16px; margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <h1>AI Content Research & Brief Generator</h1>
  <p>Built by Osmita Khan — automates the research phase of content writing</p>
</header>
<div class="container">
  <div class="card">
    <div class="tag">One-time setup</div>
    <label>Tavily API Key <span style="font-weight:400;color:#9ca3af">(free at tavily.com)</span></label>
    <input type="password" id="tavily-key" placeholder="tvly-...">
    <p class="setup-note">Your key is only stored in this browser session.</p>
  </div>
  <div class="card">
    <label>Content topic</label>
    <input type="text" id="topic-input" placeholder="e.g. MFS growth in Bangladesh, digital lending trends...">
    <button id="run-btn" onclick="runAgent()">Generate content brief</button>
    <div class="status" id="status"></div>
  </div>
  <div class="card output" id="output-card">
    <div class="brief-section">
      <div class="brief-label">Hook</div>
      <div class="brief-content" id="out-hook"></div>
    </div>
    <hr class="divider">
    <div class="brief-section">
      <div class="brief-label">Key Stats & Facts</div>
      <div class="brief-content" id="out-stats"></div>
    </div>
    <hr class="divider">
    <div class="brief-section">
      <div class="brief-label">Target Audience</div>
      <div class="brief-content" id="out-audience"></div>
    </div>
    <hr class="divider">
    <div class="brief-section">
      <div class="brief-label">Suggested Outline</div>
      <div class="brief-content" id="out-outline"></div>
    </div>
  </div>
</div>
<script>
function setStatus(msg, type="") {
  const el = document.getElementById("status");
  el.className = "status " + type;
  el.innerHTML = type === "loading" ? `<span class="spinner"></span>${msg}` : msg;
}

function generateBriefLocally(topic, results, answer) {
  // Hook
  let hook = "";
  if (answer && answer.length > 30) {
    const sentences = answer.split(/[.!?]+/).filter(s => s.trim().length > 20);
    hook = sentences[0] ? sentences[0].trim() + "." : answer.slice(0, 150) + "...";
  } else if (results.length > 0) {
    hook = `${topic} is reshaping the landscape in ways that demand attention from industry stakeholders and policymakers alike.`;
  }

  // Key stats
  let stats = "";
  const used = [];
  results.slice(0, 5).forEach((r, i) => {
    const content = (r.content || "").slice(0, 600);
    const sentences = content.split(/[.!?]+/).filter(s => {
      return s.trim().length > 30 && (
        /\d/.test(s) || 
        /grow|increas|decreas|rise|fall|percent|million|billion|major|key|significant|trend|launch|expan/i.test(s)
      );
    });
    if (sentences.length > 0) {
      const pick = sentences[0].trim();
      if (!used.includes(pick)) {
        stats += `• ${pick}. (Source ${i+1})\n`;
        used.push(pick);
      }
    }
  });
  if (!stats) stats = results.slice(0,3).map((r,i) => `• ${(r.title||"").trim()} (Source ${i+1})`).join("\n");

  // Audience
  const audience = `Professionals, researchers, and decision-makers interested in ${topic} — particularly those tracking market developments, policy changes, or strategic opportunities in this space.`;

  // Outline
  const outline = `Intro: Why ${topic} matters right now\n` +
    (results[0] ? `Section 1: ${results[0].title || "Key developments and context"}\n` : "") +
    (results[1] ? `Section 2: ${results[1].title || "Market dynamics and trends"}\n` : "") +
    `Section 3: Implications and what to watch next\nClose: Key takeaway for the reader`;

  // Sources
  let sources = "\nSources searched:\n";
  results.slice(0,5).forEach((r,i) => {
    sources += `[${i+1}] ${r.title} — ${r.url}\n`;
  });

  return { hook, stats, audience, outline: outline + sources };
}

async function runAgent() {
  const topic = document.getElementById("topic-input").value.trim();
  const tavilyKey = document.getElementById("tavily-key").value.trim();

  if (!tavilyKey) return setStatus("Please enter your Tavily API key.", "error");
  if (!topic) return setStatus("Please enter a topic.", "error");

  document.getElementById("run-btn").disabled = true;
  document.getElementById("output-card").classList.remove("visible");

  try {
    setStatus("Searching the web for recent sources...", "loading");

    const res = await fetch("https://api.tavily.com/search", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${tavilyKey}`
      },
      body: JSON.stringify({
        query: topic,
        search_depth: "basic",
        max_results: 5,
        include_answer: true
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || err.detail || "Search failed. Check your Tavily key.");
    }

    const data = await res.json();
    const results = data.results || [];
    const answer = data.answer || "";

    if (!results.length) throw new Error("No results found. Try a different topic.");

    setStatus("Building your content brief...", "loading");

    const brief = generateBriefLocally(topic, results, answer);

    document.getElementById("out-hook").textContent = brief.hook;
    document.getElementById("out-stats").textContent = brief.stats;
    document.getElementById("out-audience").textContent = brief.audience;
    document.getElementById("out-outline").textContent = brief.outline;
    document.getElementById("output-card").classList.add("visible");
    setStatus("");

  } catch (err) {
    setStatus(err.message, "error");
  } finally {
    document.getElementById("run-btn").disabled = false;
  }
}

document.getElementById("topic-input").addEventListener("keydown", e => {
  if (e.key === "Enter") runAgent();
});
</script>
</body>
</html>
